name: Build Redmi AC2100 - OpenWrt 25.12.5 IPv4-only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REF: v25.12.5
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  TZ: Asia/Shanghai
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G

jobs:
  build:
    name: Official OpenWrt build for Xiaomi Redmi Router AC2100 (RM2100)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout configuration repository
        uses: actions/checkout@v5

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-openwrt-25.12.5-rm2100-${{ hashFiles('config/redmi_ac2100_minimal.config', 'diy-part2.sh', 'files/**', '.github/workflows/build.yml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-openwrt-25.12.5-rm2100-${{ hashFiles('config/redmi_ac2100_minimal.config', 'diy-part2.sh', 'files/**', '.github/workflows/build.yml') }}-
            ${{ runner.os }}-openwrt-25.12.5-rm2100-

      - name: Free disk space and inspect runner
        run: |
          set -Eeuo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft
          sudo apt-get clean
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Install OpenWrt build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc build-essential binutils-gold bison clang ccache ecj fastjar file flex \
            g++ g++-multilib gcc gcc-multilib gawk gettext git help2man \
            libelf-dev liblzma-dev libncurses-dev libssl-dev mtd-utils \
            python3-dev python3-pip python3-setuptools rsync subversion swig \
            time unzip wget xsltproc xxd zip zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"
          df -h

      - name: Configure ccache after installing it
        run: |
          set -Eeuo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Clone pinned official stable source
        run: |
          set -Eeuo pipefail
          SOURCE_DIR="$RUNNER_TEMP/openwrt-src"
          rm -rf "$SOURCE_DIR"
          git clone --depth 1 --single-branch --branch "$OPENWRT_REF" "$OPENWRT_REPO" "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          {
            echo "OpenWrt ref: $OPENWRT_REF"
            echo "OpenWrt commit: $(git -C "$SOURCE_DIR" rev-parse HEAD)"
            echo "Build UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } | tee "$GITHUB_WORKSPACE/source-info.txt"

      - name: Update feeds and resolve target config
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          ./scripts/feeds update -a
          # Only install packages from base feed (routing/telephony/video feeds not needed)
          ./scripts/feeds install -a -p base
          ./scripts/feeds install -a -p packages
          chmod +x "$GITHUB_WORKSPACE/diy-part2.sh"
          "$GITHUB_WORKSPACE/diy-part2.sh"
          make defconfig
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp .config "$GITHUB_WORKSPACE/artifacts/resolved-openwrt.config"
          {
            for feed_dir in feeds/*; do
              [ -d "$feed_dir/.git" ] || continue
              printf '%s %s\n' "$(basename "$feed_dir")" "$(git -C "$feed_dir" rev-parse HEAD)"
            done
          } | tee "$GITHUB_WORKSPACE/feeds-info.txt"

      - name: Assert target, critical packages, IPv4-only and service pruning
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          expect_y() {
            grep -Fxq "$1=y" .config || { echo "::error::Required config missing: $1=y"; exit 1; }
            echo "[OK] $1"
          }
          expect_not_y() {
            if grep -Eq "^$1=[ym]$" .config; then echo "::error::Must be disabled: $1"; exit 1; fi
            echo "[OK] disabled: $1"
          }

          for symbol in \
            CONFIG_TARGET_ramips CONFIG_TARGET_ramips_mt7621 \
            CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_redmi-router-ac2100 \
            CONFIG_PACKAGE_base-files CONFIG_PACKAGE_busybox CONFIG_PACKAGE_procd \
            CONFIG_PACKAGE_netifd CONFIG_PACKAGE_ubus CONFIG_PACKAGE_ubusd CONFIG_PACKAGE_uci \
            CONFIG_PACKAGE_logd CONFIG_PACKAGE_dropbear CONFIG_PACKAGE_dnsmasq-full \
            CONFIG_PACKAGE_firewall4 CONFIG_PACKAGE_nftables-json CONFIG_PACKAGE_curl \
            CONFIG_PACKAGE_ca-bundle CONFIG_PACKAGE_ip-tiny CONFIG_PACKAGE_uclient-fetch \
            CONFIG_PACKAGE_dnsmasq_full_dhcp CONFIG_PACKAGE_dnsmasq_full_nftset \
            CONFIG_PACKAGE_kmod-nft-core CONFIG_PACKAGE_kmod-nft-conntrack CONFIG_PACKAGE_kmod-nft-nat \
            CONFIG_PACKAGE_kmod-nft-socket CONFIG_PACKAGE_kmod-nft-tproxy \
            CONFIG_PACKAGE_kmod-nf-conntrack CONFIG_PACKAGE_kmod-nf-nat CONFIG_PACKAGE_kmod-nf-tproxy \
            CONFIG_PACKAGE_ppp CONFIG_PACKAGE_ppp-mod-pppoe CONFIG_PACKAGE_kmod-ppp \
            CONFIG_PACKAGE_kmod-pppoe CONFIG_PACKAGE_kmod-pppox CONFIG_PACKAGE_kmod-slhc \
            CONFIG_PACKAGE_wpad-basic-mbedtls CONFIG_PACKAGE_kmod-mac80211 CONFIG_PACKAGE_kmod-cfg80211 \
            CONFIG_PACKAGE_kmod-mt76-core CONFIG_PACKAGE_kmod-mt7603 CONFIG_PACKAGE_kmod-mt7615e \
            CONFIG_PACKAGE_kmod-mt7615-firmware CONFIG_PACKAGE_kmod-zram CONFIG_PACKAGE_zram-swap; do
            expect_y "$symbol"
          done

          # IPv6 is a boolean package/build option here; the kernel check below rejects y or m.
          expect_not_y CONFIG_IPV6
          for pkg in dnsmasq_full_dhcpv6 dnsmasq_full_dnssec dnsmasq_full_auth \
                     dnsmasq_full_conntrack dnsmasq_full_ipset dnsmasq_full_tftp; do
            expect_not_y "CONFIG_PACKAGE_${pkg}"
          done
          for pkg in kmod-ipv6 kmod-ip6tables ip6tables-nft ip6tables-zz-legacy ip6tables-extra \
                     kmod-nf-conntrack6 kmod-nf-nat6 kmod-ipt-nat6 ipv6helper odhcp6c odhcpd \
                     odhcpd-ipv6only luci-proto-ipv6; do
            expect_not_y "CONFIG_PACKAGE_${pkg}"
          done
          for pkg in luci luci-base rpcd uhttpd uhttpd-mod-ubus iptables-nft iptables-zz-legacy \
                     iptables-mod-tproxy iptables-mod-socket opkg ip-full \
                     kmod-usb-core kmod-usb2 kmod-usb3 kmod-usb-storage kmod-scsi-core \
                     kmod-fs-ext4 kmod-fs-vfat kmod-nls-base; do
            expect_not_y "CONFIG_PACKAGE_${pkg}"
          done
          expect_y CONFIG_DROPBEAR_SCP
          expect_y CONFIG_BUSYBOX_CONFIG_CHPASSWD
          expect_y CONFIG_BUSYBOX_CONFIG_CROND
          expect_y CONFIG_BUSYBOX_CONFIG_CRONTAB

          cp .config "$GITHUB_WORKSPACE/artifacts/resolved-openwrt.config"

      - name: Download sources
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          make download -j"$(nproc)"
          df -h

      - name: Compile firmware
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          make -j"$(nproc)" V=s 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          ccache --show-stats | tee "$GITHUB_WORKSPACE/ccache-stats.txt"

          KERNEL_CONFIG="$(find build_dir -type f -path '*/linux-ramips_mt7621/linux-*/.config' -print -quit 2>/dev/null || true)"
          [ -n "$KERNEL_CONFIG" ] || { echo '::error::Could not find built MT7621 Linux .config'; exit 1; }
          if grep -Eq '^CONFIG_IPV6=[ym]$' "$KERNEL_CONFIG"; then
            echo '::error::The compiled Linux kernel still enables IPv6 (y or m)'; exit 1
          fi
          cp "$KERNEL_CONFIG" "$GITHUB_WORKSPACE/artifacts/resolved-linux-kernel.config"
          echo '[OK] Final Linux kernel config does not enable IPv6.'

      - name: Verify final manifest and gather firmware
        run: |
          set -Eeuo pipefail
          TARGET_DIR="$SOURCE_DIR/bin/targets/ramips/mt7621"
          [ -d "$TARGET_DIR" ] || { echo '::error::Expected ramips/mt7621 target output missing'; exit 1; }
          cp "$GITHUB_WORKSPACE/source-info.txt" "$GITHUB_WORKSPACE/artifacts/"
          cp "$GITHUB_WORKSPACE/feeds-info.txt" "$GITHUB_WORKSPACE/artifacts/"
          cp "$GITHUB_WORKSPACE/ccache-stats.txt" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp "$TARGET_DIR"/*xiaomi_redmi-router-ac2100*.bin "$GITHUB_WORKSPACE/artifacts/"
          cp "$TARGET_DIR"/*.manifest "$GITHUB_WORKSPACE/artifacts/"
          cp "$TARGET_DIR"/config.buildinfo "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp "$TARGET_DIR"/feeds.buildinfo "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp "$TARGET_DIR"/version.buildinfo "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

          for suffix in squashfs-kernel1.bin squashfs-rootfs0.bin squashfs-sysupgrade.bin; do
            find "$GITHUB_WORKSPACE/artifacts" -maxdepth 1 -type f -name "*xiaomi_redmi-router-ac2100-$suffix" -print -quit | grep -q . \
              || { echo "::error::Missing RM2100 image type: $suffix"; exit 1; }
          done

          MANIFEST="$(find "$GITHUB_WORKSPACE/artifacts" -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '::error::Missing final package manifest'; exit 1; }
          for pkg in base-files busybox procd netifd ubus ubusd uci logd dropbear dnsmasq-full firewall4 \
                     nftables-json curl ca-bundle ip-tiny ppp ppp-mod-pppoe wpad-basic-mbedtls \
                     kmod-mt7603 kmod-mt7615e kmod-mt7615-firmware kmod-nft-socket kmod-nft-tproxy \
                     kmod-nf-tproxy kmod-zram zram-swap; do
            grep -Eq "^${pkg}[[:space:]]" "$MANIFEST" || { echo "::error::Required package missing from manifest: $pkg"; exit 1; }
          done
          if grep -Eq '^(luci([^[:space:]]*)?|rpcd|uhttpd|uhttpd-mod-ubus|odhcpd|odhcpd-ipv6only|odhcp6c|kmod-ipv6|kmod-ip6tables|ip6tables-nft|ip6tables-zz-legacy|ip-full|kmod-usb-core|kmod-usb2|kmod-usb3|kmod-usb-storage|kmod-scsi-core|kmod-fs-ext4|kmod-fs-vfat|kmod-nls-base)([[:space:]]|$)' "$MANIFEST"; then
            echo '::error::A forbidden web-management, IPv6, ip-full, USB or unused filesystem package leaked into the image manifest'; exit 1
          fi
          (cd "$GITHUB_WORKSPACE/artifacts" && sha256sum *xiaomi_redmi-router-ac2100*.bin > SHA256SUMS)
          ls -lh "$GITHUB_WORKSPACE/artifacts"
          df -h

      - name: Upload firmware and build metadata
        uses: actions/upload-artifact@v6
        with:
          name: Redmi-AC2100-OpenWrt-25.12.5-IPv4-only
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Redmi-AC2100-Build-Log
          path: |
            build.log
            source-info.txt
            feeds-info.txt
            ccache-stats.txt
          if-no-files-found: ignore
          retention-days: 14
